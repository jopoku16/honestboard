[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "honestboard"
version = "0.1.0"
description = "Honest uncertainty for agent leaderboards: rank intervals, confidence sets for the best, SOTA-claim audits and selection-adjusted winner scores."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["numpy>=1.22", "scipy>=1.9"]

[project.scripts]
honestboard = "honestboard.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
