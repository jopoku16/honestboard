[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "honestboard"
version = "0.6.1"
description = "Statistical checks for AI leaderboards: a selective record test with online certification, rank intervals, a confidence set of the best system and a winner's-curse correction, from per-task results."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
  { name = "Jeffery Opoku", email = "jeffery.opoku01@utrgv.edu" },
  { name = "David Banahene" },
]
keywords = ["leaderboard", "benchmark", "evaluation", "selective inference", "winner's curse", "AI agents", "statistics"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["numpy>=1.22", "scipy>=1.9"]

[project.urls]
Homepage = "https://github.com/jopoku16/honestboard"
Repository = "https://github.com/jopoku16/honestboard"
"Live page" = "https://jopoku16.github.io/honestboard/"
Issues = "https://github.com/jopoku16/honestboard/issues"

[project.scripts]
honestboard = "honestboard.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
